name: Deploy to Vercel

# Создаёт (при первом запуске) и обновляет production-деплой проекта на Vercel.
# Требуется единственный секрет репозитория: VERCEL_TOKEN.
# Запускается на push в master и вручную через вкладку Actions.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Не секреты (публично в CLAUDE.md §2). Без них CLI в CI линкуется
          # по имени каталога и может завести ДУБЛЬ проекта вместо betaline-ai-2.
          VERCEL_ORG_ID: team_IQe20O57hTH99URRYtc0FvFt
          VERCEL_PROJECT_ID: prj_s1I5SEpy9qq8WWj2Lmq8ToTzDfOf
        run: |
          # ponytail: без секрета — тихий skip, а не failure. Токен нельзя
          # добыть автоматически (см. CLAUDE.md §gotchas), а падающий на каждый
          # push workflow заваливал почту письмами "Run failed".
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Секрет VERCEL_TOKEN не задан — деплой пропущен. Settings → Secrets and variables → Actions."
            echo "url=(skipped: no VERCEL_TOKEN)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=$(npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url"

      - name: Summary
        run: |
          echo "### Production URL — ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
