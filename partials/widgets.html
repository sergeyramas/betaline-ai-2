<!-- ═══ BetaLine Chat Widget (логика в main.js, стили в widgets.css) ═══ -->
<button id="bl-chat-btn" onclick="toggleChat()" aria-label="Открыть чат">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
    <div class="bl-badge"></div>
</button>

<div id="bl-chat-window" role="dialog" aria-label="Чат с BetaLine AI">
    <div id="bl-chat-header">
        <div class="bl-avatar">B</div>
        <div class="bl-info">
            <div style="font-size:16px;font-weight:700;margin:0;">BetaLine AI</div>
            <span>Онлайн</span>
        </div>
        <button class="bl-close" onclick="toggleChat()" aria-label="Закрыть чат">&times;</button>
    </div>
    <div id="bl-chat-messages"></div>
    <div class="bl-quick-actions" id="bl-quick-actions">
        <button class="bl-quick-btn" onclick="blQuick('Хочу узнать стоимость')">Узнать стоимость</button>
        <button class="bl-quick-btn" onclick="blQuick('Как работает агент?')">Как работает?</button>
        <button class="bl-quick-btn" onclick="blShowCallback()">Обратный звонок</button>
    </div>
    <div id="bl-callback-form">
        <input type="text" id="bl-cb-name" placeholder="Ваше имя" autocomplete="name">
        <input type="tel" id="bl-cb-phone" placeholder="+7 (___) ___-__-__" autocomplete="tel">
        <button onclick="blSendCallback()">Заказать звонок</button>
    </div>
    <div id="bl-chat-input-wrap">
        <input type="text" id="bl-chat-input" placeholder="Напишите любой вопрос...">
        <button id="bl-chat-send" onclick="blSend()" aria-label="Отправить сообщение">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
    <div id="bl-chat-footer">Сделано в <a href="https://t.me/BetalineAI_bot" target="_blank" rel="noopener noreferrer">BetaLine AI</a></div>
</div>
